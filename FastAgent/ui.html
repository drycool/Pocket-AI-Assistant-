<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastAgent — встроенный интерфейс</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 14px; border-bottom: 1px solid #8884; display: flex; gap: 14px; align-items: baseline; }
  header h1 { font-size: 16px; margin: 0; }
  header .note { opacity: .65; font-size: 12px; }
  main { flex: 1; overflow: auto; padding: 12px 14px; }
  pre#log { margin: 0; white-space: pre-wrap; word-break: break-word; font: 14px/1.5 ui-monospace, monospace; }
  .who { font-weight: 600; }
  footer { border-top: 1px solid #8884; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  #q { grid-column: 1 / -1; width: 100%; resize: vertical; font: inherit; padding: 8px; border-radius: 6px; border: 1px solid #8886; }
  .buttons { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid #8886; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { font-size: 12px; opacity: .7; }
</style>
</head>
<body>
<header>
  <h1>FastAgent</h1>
  <span class="note">встроенный интерфейс · команды на ПК в этом режиме не выполняются</span>
  <span id="status" style="margin-left:auto"></span>
</header>
<main><pre id="log"></pre></main>
<footer>
  <textarea id="q" rows="3" placeholder="Вопрос (Ctrl+Enter — отправить)"></textarea>
  <div class="buttons">
    <button id="send">Отправить</button>
    <button id="diag" title="требует уровень L1+">Диагностика</button>
    <button id="report">Отчёт</button>
    <button id="clear">Очистить</button>
  </div>
</footer>
<script>
const log = document.getElementById('log');
const q = document.getElementById('q');
const status = document.getElementById('status');
const buttons = [...document.querySelectorAll('button')];

function add(who, text) {
  log.textContent += (who ? who + ': ' : '') + text + '\n\n';
  log.scrollTop = log.scrollHeight;
  log.parentElement.scrollTop = log.parentElement.scrollHeight;
}
function busy(on) { buttons.forEach(b => b.disabled = on); status.textContent = on ? 'запрос…' : ''; }
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

async function ask() {
  const text = q.value.trim();
  if (!text) return;
  q.value = '';
  add('Вы', text);
  busy(true);
  try {
    const d = await post('/api/chat', { message: text });
    add('AI (' + d.provider + ', ttft ' + d.ttft_ms + ' мс)', d.answer);
  } catch (e) {
    add('Ошибка', e.message);
  } finally { busy(false); q.focus(); }
}

document.getElementById('send').onclick = ask;
q.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ask(); } });

document.getElementById('diag').onclick = async () => {
  busy(true);
  try {
    const r = await fetch('/api/diag'); const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    add('Диагностика', d.diag);
  } catch (e) { add('Ошибка', e.message); } finally { busy(false); }
};

document.getElementById('report').onclick = async () => {
  busy(true);
  try {
    const d = await post('/api/report');
    add('Отчёт', 'Сохранён: ' + d.path + '\n' + d.chars + ' симв.');
  } catch (e) { add('Ошибка', e.message); } finally { busy(false); }
};

document.getElementById('clear').onclick = () => { log.textContent = ''; };
q.focus();
</script>
</body>
</html>
